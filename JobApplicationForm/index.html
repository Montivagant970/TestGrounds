<body>
    <div class="container">
        <form>
            <h1>Job Application Form</h1>
            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Wiggy McJenkins" required>
            <label for="email">Email Address:</label>
            <input type="email" id="email" placeholder="dontemailme@gmail.com" required>
            <label for="position">Desired Position:</label>
            <select id="position" required>
                <option>--Please select an option--</option>
                <option>CEO</option>
                <option>Janitor</option>
                <option>Ham Jeans</option>
                <option>My cat?</option>
            </select>
            <fieldset class="radio-group">
                <legend>Availability</legend>
                <input type="radio" id="full-time" name="availability">
                <label for="full-time" class="radio-btn">Full-time</label>
                <input type="radio" id="part-time" name="availability">
                <label for="part-time" class="radio-btn">Part-time</label>
                <input type="radio" id="all-time" name="availability">
                <label for="all-time" class="radio-btn">All the time</label>
            </fieldset>
            <label for="message">Optional message:</label>
            <textarea id="message" placeholder="i leik trains"></textarea>
            <button type="submit">Submit Application</button>
        </form>
    </div>
</body>
</html>
